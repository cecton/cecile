# Force specific applications to always route to a given audio sink.
# The Lua script (force-default-sink.lua) reads these rules and overrides
# WirePlumber's default target selection for matching streams.
#
# HOW TO ADD A NEW APP
#
# 1. Play audio from the app so its stream appears in PipeWire.
#
# 2. Find the stream properties to decide which field to match on:
#
#      pactl list sink-inputs | awk '/Sink Input/{n=$3} /node.name|application\.(name|process\.binary)/{printf "%s  %s\n", n, $0}'
#
#    The output looks like:
#      #123    application.name = "Telegram Desktop"
#      #123    application.process.binary = "Telegram"
#      #123    node.name = "Telegram Desktop"
#
# 3. Pick a match field that uniquely identifies the app.
#    Commonly useful fields:
#      application.name         – human-friendly, e.g. "Telegram Desktop"
#      application.process.binary – the executable name, e.g. "Telegram"
#      node.name                – PipeWire node name, e.g. "alsa_playback.doneward"
#
# 4. Add a new entry to the route array below, e.g.:
#
#      {
#        match = { application.name = "Telegram Desktop" },
#        target = "alsa_loopback_device.alsa_output.pci-0000_0c_00.1.hdmi-stereo"
#      },
#
# 5. Restart WirePlumber:
#
#      systemctl --user restart wireplumber
#
# 6. Verify the stream lands on the expected sink:
#
#      journalctl --user -u wireplumber --since "1 minute ago" | grep s-set-default-sink
#
#    You should see "... routed {name} to {target}".
#
# CHANGING THE TARGET SINK
#
# Find available sinks and their node.name:
#
#   pactl list sinks | grep -E "Sink #|node\.name|Description:"
#
# Then update the "target" value in the desired rule.
#
# COMMENTS
# - Lines starting with "#" are ignored.
# - Comment out a rule with "#{" ... "#}" to disable it without removing it.

wireplumber.components = [
  {
    name = "force-default-sink.lua",
    type = "script/lua",
    provides = "custom.force-default-sink",
    arguments = {
      route = [
        #{
        #  match = { application.process.binary = "steamwebhelper" },
        #  target = "alsa_loopback_device.alsa_output.pci-0000_0c_00.1.hdmi-stereo"
        #},
        #{
        #  match = { node.name = "alsa_playback.doneward" },
        #  target = "alsa_loopback_device.alsa_output.pci-0000_0c_00.1.hdmi-stereo"
        #},
        #{
        #  match = { application.name = "Spirit City" },
        #  target = "alsa_loopback_device.alsa_output.pci-0000_0c_00.1.hdmi-stereo"
        #},
      ]
    }
  }
]

wireplumber.profiles = {
  main = {
    custom.force-default-sink = required
  }
}
